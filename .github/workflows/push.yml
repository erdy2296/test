name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Contoh: erdy2296/test'
        required: true

jobs:
  push_to_replicate:
    name: Push to Replicate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create private config
        env:
          INNER_REPLICATE_API_TOKEN: ${{ secrets.INNER_REPLICATE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os

          token = os.environ.get("INNER_REPLICATE_API_TOKEN")

          if not token:
              raise SystemExit("ERROR: INNER_REPLICATE_API_TOKEN belum dibuat di GitHub Secrets")

          with open("private_config.py", "w", encoding="utf-8") as f:
              f.write("REPLICATE_API_TOKEN = " + repr(token) + "\n")

          print("private_config.py created")
          PY

      - name: Check files
        run: |
          ls -la
          test -f cog.yaml
          test -f predict.py
          test -f private_config.py

      - name: Setup Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}

      - name: Push to Replicate
        run: cog push r8.im/${{ inputs.model_name }}
